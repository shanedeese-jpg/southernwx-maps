<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SouthernWX Weather Center</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #101820;
            color: white;
            text-align: center;
        }

        header {
            background: #18242f;
            padding: 25px;
            border-bottom: 2px solid #394956;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            margin-top: 8px;
            color: #b8c4cc;
        }

        main {
            padding: 40px 20px;
        }

        .card {
            max-width: 900px;
            margin: auto;
            background: #18242f;
            border-radius: 12px;
            padding: 30px;
        }

        .button-row {
            margin: 25px 0;
        }

        button {
            background: #2f5f7f;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 22px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #427da3;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            background: #101820;
            border-radius: 8px;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            color: #8796a1;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>SouthernWX</h1>
    <div class="subtitle">Weather Guidance Center</div>
</header>

<main>

    <div class="card">

        <h2>SouthernWX Model Products</h2>

        <p>
            Regional and state-level weather guidance for the Southeast.
        </p>

        <div class="button-row">
            <button>North Carolina</button>
            <button>South Carolina</button>
            <button>Virginia</button>
        </div>

        <div class="status">
            <h3>🚧 Viewer Coming Soon</h3>

            <p>
                SouthernWX weather maps will live here.
            </p>
        </div>

    </div>

</main>

<footer>
    SouthernWX Weather Center
</footer>

</body>
</html>
